name: t2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Tests
        run: node --test scripts/threat-data.test.mjs

      - name: Download the set that is online now
        id: previous
        run: |
          set +e
          node scripts/threat-data.mjs fetch-published --out previous
          code=$?
          set -e
          if [ "$code" = 0 ]; then
            echo "args=--previous previous" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 3 ]; then
            echo "Nothing is published yet; this is the first set."
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "Could not read the published set (exit $code); not publishing."
            exit "$code"
          fi

      - name: Build and sign
        env:
          TOOLKIT_DEFS_KEY: ${{ secrets.TOOLKIT_DEFS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_ARGS: ${{ steps.previous.outputs.args }}
          ALLOW_DROP: ${{ inputs.allow_drop && '--allow-drop' || '' }}
        # The secret is only in this step's environment. The script never prints it.
        run: node scripts/threat-data.mjs build --out site/v1 --seq auto --require-signature $PREVIOUS_ARGS $ALLOW_DROP

      - name: Verify what was built
        run: node scripts/threat-data.mjs verify site/v1

      - name: Add the page and the notices
        run: |
          cp public/index.html site/index.html
          cp NOTICE.md site/NOTICE.md
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

