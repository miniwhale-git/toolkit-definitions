# Builds the threat lists every day and publishes them with GitHub Pages at /v1/.
#
# A gate failure (a source empty or changed shape, a big drop or sudden growth against the set now online,
# too many keep-list hits, a bad signature) fails the build job. Then nothing is deployed and the last good
# set stays online. Ordinary changes do not stop it: a host table over its budget is cut from the least
# trusted source, and a host source that more than doubles is held at its previous data. Every build writes a
# short report to the run summary; the "report" job opens or updates the issue "Daily lists" with it when the
# build failed or when something needs a look (a new keep-list hit, a new certificate entry, a new name
# listed under a system prefix, a trim or a hold).
#
# Needs: Settings > Pages > Source "GitHub Actions"; an environment named "publish" that only the main branch
# may use, holding the secret TOOLKIT_DEFS_KEY (the Ed25519 private key, PEM text). Only the build job runs
# in that environment, so a workflow pushed to any other branch cannot read the key. The first job fails the
# run when the key is (also) a repository secret, which every job could read.

name: publish

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      allow_drop:
        description: "Accept a set that is more than 30% smaller than the one online (a source really shrank)"
        type: boolean
        default: false
      allow_growth:
        description: "Accept app entries more than 25% above the set online, and a host source that more than doubled (it really grew)"
        type: boolean
        default: false

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    # bash -eo pipefail, so a failure inside "| tee" still fails the step.
    shell: bash

jobs:
  # No environment here: a secret this job can see is a repository (or organisation) secret, not the
  # publish environment's. The key must live only in the environment.
  key-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      KEY_OUTSIDE_ENVIRONMENT: ${{ secrets.TOOLKIT_DEFS_KEY != '' }}
    steps:
      - name: The signing key is only in the publish environment
        run: |
          if [ "$KEY_OUTSIDE_ENVIRONMENT" = "true" ]; then
            echo "::error::TOOLKIT_DEFS_KEY is a repository or organisation secret, so any job on any branch can read it. Delete it there and keep it only in the 'publish' environment."
            exit 1
          fi
          echo "TOOLKIT_DEFS_KEY is not visible outside the publish environment."

  build:
    needs: key-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: publish
    permissions:
      contents: read
    outputs:
      failure: ${{ steps.why.outputs.text }}
      report: ${{ steps.report.outputs.text }}
      notify: ${{ steps.report.outputs.notify }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Tests
        run: node --test scripts/*.test.mjs 2>&1 | tee -a run.log

      - name: Download the set that is online now
        id: previous
        run: |
          set +e
          node scripts/threat-data.mjs fetch-published --out previous 2>&1 | tee -a run.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = 0 ]; then
            echo "args=--previous previous" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 3 ]; then
            echo "Nothing is published yet; this is the first set." | tee -a run.log
            echo "args=" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 4 ]; then
            echo "::warning::The set online is ours but in the first format (6-byte host keys), which phones refuse. Building without a previous set this once." | tee -a run.log
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "Could not read the published set (exit $code); not publishing." | tee -a run.log
            exit "$code"
          fi

      - name: Build and sign
        env:
          TOOLKIT_DEFS_KEY: ${{ secrets.TOOLKIT_DEFS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_ARGS: ${{ steps.previous.outputs.args }}
          ALLOW_DROP: ${{ inputs.allow_drop && '--allow-drop' || '' }}
          ALLOW_GROWTH: ${{ inputs.allow_growth && '--allow-growth' || '' }}
        # The secret is only in this step's environment. The script never prints it.
        run: node scripts/threat-data.mjs build --out site/v1 --seq auto --require-signature --report report.md $PREVIOUS_ARGS $ALLOW_DROP $ALLOW_GROWTH 2>&1 | tee -a run.log

      - name: Verify what was built
        run: node scripts/threat-data.mjs verify site/v1 2>&1 | tee -a run.log

      - name: Add the page and the notices
        run: |
          cp public/index.html site/index.html
          cp NOTICE.md site/NOTICE.md
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # The build's report, passed or not, to the run summary and to the report job. Backticks and "@" are
      # removed from everything that came from the build, so source text cannot format the page or mention anyone.
      - name: Report
        id: report
        if: always()
        run: |
          delimiter="REPORT_$(openssl rand -hex 16)"
          if [ -f report.md ]; then
            tr -d '`@' < report.md > report.clean.md
          else
            {
              echo "## Daily lists: the build stopped before it wrote a report"
              echo
              echo "Last lines of the run:"
              echo
              tail -n 40 run.log 2>/dev/null | cut -c1-500 | tr -d '`@' | sed 's/^/    /' || echo "    (no output was kept)"
            } > report.clean.md
          fi
          cat report.clean.md >> "$GITHUB_STEP_SUMMARY"
          if head -n 1 report.clean.md | grep -q '^<!-- notify: yes -->'; then echo "notify=yes" >> "$GITHUB_OUTPUT"; else echo "notify=no" >> "$GITHUB_OUTPUT"; fi
          {
            echo "text<<$delimiter"
            head -c 60000 report.clean.md
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # On failure: the failing gates and the last lines, for the issue. Never the key: the script does not print it.
      - name: Keep what failed
        id: why
        if: failure()
        run: |
          delimiter="FAILED_$(openssl rand -hex 16)"
          {
            echo "text<<$delimiter"
            echo "Failing gates:"
            grep -E '^FAIL ' run.log | cut -c1-1500 | head -20 | tr -d '`@' || true
            echo
            echo "Last lines:"
            tail -n 40 run.log 2>/dev/null | cut -c1-500 | tr -d '`@' || echo "(no output was kept)"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # One issue, "Daily lists": its body is the latest report, and each run that needs a look adds a short comment,
  # so the owner is told. Runs when the build failed, when the key guard failed, or when the report asks for a look.
  report:
    needs: [key-guard, build]
    if: ${{ always() && (needs.build.result == 'failure' || needs.build.outputs.notify == 'yes' || needs.key-guard.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update "Daily lists"
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ needs.build.outputs.report }}
          FAILURE: ${{ needs.build.outputs.failure }}
          BUILD_RESULT: ${{ needs.build.result }}
          GUARD_RESULT: ${{ needs.key-guard.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Daily lists"
          today=$(date -u +%Y-%m-%d)
          {
            if [ "$GUARD_RESULT" = "failure" ]; then
              echo "The run on $today stopped: TOOLKIT_DEFS_KEY is a repository or organisation secret. Delete it there and keep it only in the publish environment. Nothing was built."
            elif [ "$BUILD_RESULT" = "failure" ]; then
              echo "The daily build failed on $today. Nothing was published; the last good set stays online."
            else
              echo "The daily build on $today published the lists, and something in it needs a look."
            fi
            echo
            echo "Run: $RUN_URL"
            echo
            printf '%s\n' "$REPORT" | tr -d '`@'
            if [ -n "$FAILURE" ]; then
              echo
              echo '```'
              printf '%s\n' "$FAILURE" | tr -d '`@'
              echo '```'
            fi
          } > body.md
          head -c 65000 body.md > body.cut.md
          reasons=$(printf '%s\n' "$REPORT" | tr -d '`@' | grep -m1 '^Needs a look:' | cut -c1-500 || true)
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file body.cut.md
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$today: build ${BUILD_RESULT:-not run}. ${reasons:-See the report above.} $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.cut.md
          fi

  # GitHub switches scheduled workflows off after 60 days without a commit. This keeps the schedule alive
  # with an empty commit when the last one is older than 45 days, also when the build failed.
  keepalive:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Empty commit when the last one is old
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name attnom
            git config user.email support@attnom.com
            git commit --allow-empty -m "Keep the daily schedule enabled"
            git push
          fi
